<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWB Studio</title>
<meta name="description" content="JWB Studio makes ReadSmith, an e-book reader for iPhone, iPad, and Mac.">
<link rel="icon" href="/readsmith/icon.png">
<style>
:root{--bg:#fff;--fg:#1b1a18;--dim:#5f5b55;--line:#e6e2da;--card:#f8f6f1;--link:#2a5db0}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--fg:#ece8e1;--dim:#a39d93;--line:#2c2925;--card:#1a1816;--link:#8fb4ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:64px 16px 80px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
.dim{color:var(--dim)}
a.app{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:28px}
a.app img{width:64px;height:64px;border-radius:14px;flex:none}
a.app b{font-size:18px}
a{color:var(--link)}
footer{max-width:720px;margin:0 auto;padding:0 16px 60px;color:var(--dim);font-size:13px}
</style>
<main>
  <h1>JWB Studio</h1>
  <p class="dim">Apps for iPhone, iPad, and Mac · 아이폰, 아이패드, 맥 앱</p>
  <a class="app" href="/readsmith/">
    <img src="/readsmith/icon.png" alt="">
    <span><b>ReadSmith</b><br><span class="dim">E-book reader where your view settings win · 내 눈에 맞춰 읽는 전자책 리더</span></span>
  </a>
  <p style="margin-top:28px">Contact · 연락처: <a href="mailto:support@jwbstudio.app">support@jwbstudio.app</a></p>
</main>
<footer>© 2026 JWB Studio · <a href="/readsmith/privacy.html">ReadSmith Privacy Policy · 개인정보 처리방침</a></footer>
</html>
